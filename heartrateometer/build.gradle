apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "net.kibotu.heartrateometer"
    compileSdkVersion 35

    defaultConfig {

        minSdkVersion 15
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // region kotlin

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    // endregion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation "androidx.annotation:annotation:1.9.1"
    testImplementation 'junit:junit:4.12'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.2.51"

    compileOnly "com.squareup.retrofit2:retrofit:2.3.0"
    compileOnly "com.squareup.retrofit2:adapter-rxjava2:2.3.0"
}